<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citation Deathmatch</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e0a12; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
    canvas {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: auto;
      aspect-ratio: 16 / 9;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>
  <!-- Load order matters: each file adds to the global CD namespace. -->
  <script src="src/config.js"></script>
  <script src="src/roster.js"></script>
  <script src="src/input.js"></script>
  <script src="src/fighter.js"></script>
  <script src="src/combat.js"></script>
  <script src="src/effects.js"></script>
  <script src="src/citations.js"></script>
  <script src="src/match.js"></script>
  <script src="src/render.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
